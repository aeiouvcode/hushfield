<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9c9a2">
<meta name="description" content="A small place to be. An ambient field and shoreline that move at their own pace.">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; media-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Hushfield - a small place to be</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<main id="app" aria-label="A quiet animated place">
  <canvas id="world" aria-hidden="true"></canvas>
  <header class="top"><span class="wordmark">hushfield<span class="period">.</span></span><button id="sound" class="sound" type="button" aria-label="Turn on gentle sound" aria-pressed="false"><span class="sound-glyph" aria-hidden="true">♫</span><span class="sound-text">sound off</span></button></header>
  <div class="caption" aria-live="polite"><p id="scene-name">the field at last light</p><span id="scene-note">stay as long as you like</span></div>
  <nav class="places" aria-label="Choose a place"><button type="button" data-place="field" aria-current="true">field</button><span aria-hidden="true">/</span><button type="button" data-place="shore">shore</button><span aria-hidden="true">/</span><button type="button" data-place="rain">rain</button></nav>
</main>
</body>
</html>
